# Migraitor secrets file (key=value). Same keys as v1. Point to it with
#   --management.credentials=D:/Migraitor/credentials.properties
# Do not commit the real file.

# ---- Database -------------------------------------------------------------
sqlserverurl=jdbc:sqlserver://dbhost:1433;databaseName=migration;encrypt=true;trustServerCertificate=true
sqlserverusername=
sqlserverpassword=
# postgresqlurl=jdbc:postgresql://dbhost:5432/migration
# postgresqlusername=
# postgresqlpassword=

# ---- UI login and encryption of passwords saved from the UI -----------------
uiusername=admin
uipassword=
# 32 random bytes in Base64, e.g.  openssl rand -base64 32
configkey=
keystorepassword=

# ---- Proxy (optional) --------------------------------------------------------
proxyIp=
proxyPort=

# ---- Target Content Server (fallback when no connection is saved in the UI) -----
cstargethostname=client.opentext.cloud
cstargetauthusername=
cstargetauthpassword=
csedition=cloud
proxy=true

# ---- Source Content Server, CStoCS (fallback) --------------------------------
cssourcehostname=cs-onprem.client.local
cssourceauthusername=
cssourceauthpassword=
cssourceedition=onprem
cssourceproxy=false

# ---- SAP ArchiveLink, SAPALNoDep ----------------------------------------------
sapendpointws=https://sap-host:44300/sap/bc/srt/rfc/sap/zrfc_migration_ot/100/zrfc_migration_ot/zrfc_migration_ot
sapusername=
sappassword=
