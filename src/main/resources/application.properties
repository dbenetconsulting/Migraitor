# ============================================================================
#  Migraitor - base configuration. Client specific values go in a profile
#  (application-viega.properties, application-deichmann.properties) or in an
#  external application.properties next to the jar. Secrets go in the file
#  pointed to by management.credentials (key=value), never here.
# ============================================================================

spring.application.name=migraitor

# ---- Web server --------------------------------------------------------------
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${MIGRAITOR_KEYSTORE:keystore-migration.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=migrationToolCert
server.ssl.key-store-password=${keystorepassword:}
server.servlet.session.timeout=8h
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ---- Secrets file (same format and keys as v1) ---------------------------------
management.credentials=${MIGRAITOR_SECRETS:credentials.properties}

# ---- Database (URL, user and password come from the secrets file) -----------------
# sqlserver | postgresql
migration.db-type=sqlserver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# ---- Migration engine ---------------------------------------------------------
migration.protocol=https://
# Only for test servers with self-signed certificates.
migration.trust-self-signed=false
# Documents processed in parallel inside one job, and jobs running at the same time.
migration.threads=3
migration.max-parallel-jobs=2
migration.ticket-ttl=20m
migration.http-connect-timeout=60s
migration.http-request-timeout=15m
migration.max-name-attempts=25
# Temporary files of the document being processed (deleted afterwards). Empty = system temp.
migration.work-dir=
# Debug only: keep a copy of every downloaded/converted file here. Leave empty in production.
migration.debug-dump-dir=

migration.scheduler.enabled=false
migration.scheduler.interval-ms=300000

# ---- Actuator -------------------------------------------------------------------
# health is public; shutdown requires login (v1 exposed it without authentication).
management.endpoints.web.exposure.include=health,shutdown
management.endpoint.shutdown.enabled=true
management.endpoint.health.show-details=never

# ---- Logs ----------------------------------------------------------------------------
logging.file.path=${LOG_PATH:logs}
