<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Migraitor · Sign in</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<main class="login-card">
    <div class="brand brand-lg"><span class="brand-mark">M</span><span>Migraitor</span></div>
    <p class="muted">Document migration tool</p>
    <div class="alert alert-error" th:if="${param.error}">Wrong user or password.</div>
    <div class="alert alert-ok" th:if="${param.logout}">You have been signed out.</div>
    <form method="post" th:action="@{/login}" class="form">
        <label>User<input name="username" autocomplete="username" required autofocus></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
